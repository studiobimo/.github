# Every tool this repo's hooks and CI run, at one version each. mise.lock records the
# checksums, and `mise install` refuses anything that does not match it.
#
#   mise install                    # once, and after this file changes
#   mise exec -- lefthook install   # wire the git hooks
#
# Dependabot does not read this file, so versions are bumped by hand: change one here,
# run `mise lock`, and commit this file, mise.lock and .mise/locks/ together.

[settings]
lockfile = true

[tools]
node = "24.21.0"
pnpm = "11.21.0"
lefthook = "2.1.16"
actionlint = "1.7.12"
shellcheck = "0.11.0"
gitleaks = "8.30.1"
zizmor = "1.30.1"
"npm:prettier" = "3.9.9"
"npm:@commitlint/cli" = "21.2.3"
"npm:@commitlint/config-conventional" = "21.2.3"
