name: PR checks

# The org's non-negotiables, enforced on every pull request: a Conventional
# Commits title (it becomes the squash commit), a Conventional Branch name, a
# size limit that pushes large work into a stack, and Conventional Commits on
# each commit in the branch.
#
# The checks live in actions/pr-checks so this file stays readable and repos can
# also call that action directly. It is checked out at job_workflow_sha -- the
# commit of *this* workflow -- so the scripts always match the version the
# caller pinned, with no self-referential SHA to keep updating.
#
# Nothing here reads a secret, and the pull request's code is only ever read by
# git, never executed.

on:
  workflow_call:
    inputs:
      max-files:
        description: Most files a single pull request may change.
        type: number
        required: false
        default: 20
      check-commits:
        description: Also require every commit in the branch to be a Conventional Commit.
        type: boolean
        required: false
        default: true

permissions: {}

jobs:
  pr-checks:
    name: Title, branch, size, commits
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Check out the pull request
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # Both sides of the comparison have to be present for the size check.
          fetch-depth: 0
          persist-credentials: false

      - name: Check out the checks themselves
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: studiobimo/.github
          ref: ${{ github.job_workflow_sha }}
          path: .studiobimo-ci
          persist-credentials: false

      # The `$/` form zizmor prefers exists to stop a workflow loading an action cloned
      # at runtime -- which is deliberately what this does. The action comes from THIS
      # repo at job_workflow_sha, not from the caller's checkout.
      - uses: ./.studiobimo-ci/actions/pr-checks # zizmor: ignore[self-repository]
        with:
          title: ${{ github.event.pull_request.title }}
          branch: ${{ github.head_ref }}
          base-sha: ${{ github.event.pull_request.base.sha }}
          head-sha: ${{ github.event.pull_request.head.sha }}
          max-files: ${{ inputs.max-files }}
          check-commits: ${{ inputs.check-commits }}
