name: self-secrets

on:
  pull_request:

permissions: {}

concurrency:
  group: self-secrets-${{ github.ref }}
  cancel-in-progress: true

jobs:
  scan:
    permissions:
      contents: read
    # `./` rather than `$/` on purpose; self-lint.yml explains why.
    uses: ./.github/workflows/ci-gitleaks.yml # zizmor: ignore[self-repository]
