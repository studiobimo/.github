name: self-secrets

# Dogfooding caller: runs the ci-gitleaks library workflow on this repo's own pull
# requests, by local path.

on:
  pull_request:

permissions: {}

concurrency:
  group: self-secrets-${{ github.ref }}
  cancel-in-progress: true

jobs:
  scan:
    permissions:
      contents: read
    # zizmor prefers `$/` over `./`, because a workspace-relative ref can load
    # something a previous step cloned at runtime. That risk is real for a step-level
    # action ref -- it is why the actions above moved to `$/` -- but not for a
    # job-level reusable-workflow call, which GitHub resolves when the run is queued,
    # never from the workspace. `./` buys something concrete in exchange: actionlint
    # validates a local call against the callee's declarations (it catches an input
    # name that does not exist, and lists the ones that do), while `$/` it cannot
    # parse at all, so the call would go unchecked. Keeping the validation.
    uses: ./.github/workflows/ci-gitleaks.yml # zizmor: ignore[self-repository]
