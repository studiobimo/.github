name: ci-lint

# Reusable: runs a repo's own lefthook hooks over the whole tree, with the tools its
# mise.toml pins.
#
# This is the same command a developer runs, at the same versions: mise.lock records
# every tool's checksum, and mise refuses to install anything that does not match it.
# So a hook that passes locally passes here, and the two files stay the only place a
# linter or its version is written down.
#
# The caller's lefthook.yml decides what runs. By default that is its `pre-commit`
# hook; lefthook's --all-files gives each job every file its glob matches rather than
# the staged ones.
#
#   jobs:
#     lint:
#       uses: studiobimo/.github/.github/workflows/ci-lint.yml@v1
#       with:
#         exclude: spotless

on:
  workflow_call:
    inputs:
      hook:
        description: The lefthook hook to run.
        type: string
        required: false
        default: pre-commit
      exclude:
        description: >-
          Comma-separated job names or tags to skip, passed as LEFTHOOK_EXCLUDE. Use it
          for jobs another workflow already covers -- a Gradle `check` that runs
          spotlessCheck, say -- rather than dragging a whole toolchain into this one.
        type: string
        required: false
        default: ''
      mise-version:
        description: mise release to install.
        type: string
        required: false
        default: '2026.10.0'
      timeout-minutes:
        description: Job timeout. Tools are downloaded on a cold cache.
        type: number
        required: false
        default: 15
      paths:
        description: >-
          Newline-separated globs with GitHub `paths:` syntax. When set, a pull request that
          touches none of them skips the hooks and still reports success; other events always
          run. Empty runs every time. The hooks cover the whole tree, so list every path a hook
          reads, including its config files.
        type: string
        required: false
        default: ''

permissions: {}

jobs:
  lint:
    # The rulesets require `lint / hooks`: the caller's job, then this name. Renaming
    # it strands every open pull request waiting on a check that never reports.
    name: hooks
    runs-on: ubuntu-latest
    timeout-minutes: ${{ inputs.timeout-minutes }}
    permissions:
      contents: read
    # Pushing again to a pull request supersedes the run in flight, so it is cancelled rather
    # than billed to the end. Only pull requests cancel: a push to the default branch, a
    # merge group and a schedule always finish. `github.workflow` is the caller's name, and
    # the library suffix keeps this group distinct from any the caller declares itself.
    concurrency:
      group: ci-lint-${{ github.workflow }}-${{ github.ref }}
      cancel-in-progress: ${{ github.event_name == 'pull_request' }}
    steps:
      # Gates every later step, so a skipped check still reports success (see changed-paths).
      - name: Check changed paths
        id: changes
        uses: $/.github/actions/changed-paths
        with:
          paths: ${{ inputs.paths }}

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        if: steps.changes.outputs.changed == 'true'
        with:
          persist-credentials: false

      # Installs mise, then the caller's tools. With a mise.lock present the action
      # passes --locked itself, so a tool whose checksum is not recorded fails here.
      # Its cache is keyed on the mise files, so a version bump rebuilds it.
      - uses: jdx/mise-action@7a4e45a543138629540c9a1616d08632b893e492 # v5.0.1
        if: steps.changes.outputs.changed == 'true'
        with:
          version: ${{ inputs.mise-version }}

      - name: Run the hooks
        if: steps.changes.outputs.changed == 'true'
        env:
          HOOK: ${{ inputs.hook }}
          LEFTHOOK_EXCLUDE: ${{ inputs.exclude }}
        run: mise exec -- lefthook run "${HOOK}" --all-files --no-tty
