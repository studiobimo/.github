name: ci-pre-commit

# Reusable: runs a repo's own pre-commit hooks over the whole tree.
#
# The other lint workflows here (ci-workflows, ci-gitleaks) exist for repos that
# have no pre-commit config: they download actionlint, zizmor, shellcheck and
# gitleaks and run them directly. A repo that *does* keep a .pre-commit-config.yaml
# already pins those same tools, by frozen SHA, next to a dozen others -- so calling
# both would run four tools twice at two sets of version numbers that drift apart.
# Call this one instead, and the config file stays the single source of truth for
# what lints and at which version.
#
# That is also what makes local and CI results match: this runs the same command a
# developer runs, so `make lint` (or whatever the repo calls it) is genuinely proven
# here rather than approximated.
#
# uv is fetched as a pinned release tarball rather than through setup-uv, for the
# same reason the linters here are: one fewer action to trust, and the version is
# visible in this file.
#
#   jobs:
#     lint:
#       uses: studiobimo/.github/.github/workflows/ci-pre-commit.yml@v1
#       with:
#         uv-project: .devtools
#         skip: spotless

on:
  workflow_call:
    inputs:
      uv-project:
        description: >-
          Directory holding the pyproject.toml and uv.lock that pin pre-commit, run as
          `uv --project <dir> run pre-commit`. Empty fetches pre-commit standalone with
          uvx at `pre-commit-version`.
        type: string
        required: false
        default: ''
      pre-commit-version:
        description: pre-commit release to use when `uv-project` is empty.
        type: string
        required: false
        default: '4.6.2'
      uv-version:
        description: uv release to download.
        type: string
        required: false
        default: '0.12.17'
      skip:
        description: >-
          Comma-separated hook ids to skip, passed as pre-commit's SKIP. Use it for hooks
          another job already covers -- a Gradle `check` that runs spotlessCheck, say --
          rather than dragging a whole toolchain into the lint job.
        type: string
        required: false
        default: ''
      extra-args:
        description: Extra arguments appended to `pre-commit run`.
        type: string
        required: false
        default: ''
      timeout-minutes:
        description: Job timeout. Hook environments build from source on a cold cache.
        type: number
        required: false
        default: 20

permissions: {}

jobs:
  pre-commit:
    name: pre-commit
    runs-on: ubuntu-latest
    timeout-minutes: ${{ inputs.timeout-minutes }}
    permissions:
      contents: read
    env:
      UV_VERSION: ${{ inputs.uv-version }}
      UV_PROJECT: ${{ inputs.uv-project }}
      PRE_COMMIT_VERSION: ${{ inputs.pre-commit-version }}
      EXTRA_ARGS: ${{ inputs.extra-args }}
      # pre-commit reads this itself; empty means skip nothing.
      SKIP: ${{ inputs.skip }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install uv
        run: |
          mkdir -p "${HOME}/.local/bin"
          curl -fsSL \
            "https://github.com/astral-sh/uv/releases/download/${UV_VERSION}/uv-x86_64-unknown-linux-gnu.tar.gz" \
            | tar -xz --strip-components=1 -C "${HOME}/.local/bin" \
                uv-x86_64-unknown-linux-gnu/uv uv-x86_64-unknown-linux-gnu/uvx
          # GITHUB_PATH only takes effect in later steps, so the sanity check here
          # has to use the absolute path.
          echo "${HOME}/.local/bin" >> "${GITHUB_PATH}"
          "${HOME}/.local/bin/uv" --version

      # Hook environments are the slow part -- several of them compile or fetch a
      # toolchain. They are keyed on the config, so any `rev:` bump rebuilds them and
      # nothing stale is ever reused.
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cache/pre-commit
            ~/.cache/uv
          key: pre-commit-${{ runner.os }}-${{ hashFiles('.pre-commit-config.yaml') }}
          restore-keys: |
            pre-commit-${{ runner.os }}-

      - name: Run the hooks
        run: |
          if [ -n "${UV_PROJECT}" ]; then
            echo "Using pre-commit pinned by ${UV_PROJECT}"
            uv --project "${UV_PROJECT}" sync --frozen
            set -- uv --project "${UV_PROJECT}" run pre-commit
          else
            echo "Using pre-commit ${PRE_COMMIT_VERSION} via uvx"
            set -- uvx "pre-commit@${PRE_COMMIT_VERSION}"
          fi

          # --show-diff-on-failure turns "a formatter would change this" from a bare
          # exit code into the actual patch, which is the whole fix in the log.
          # shellcheck disable=SC2086 # EXTRA_ARGS is a deliberate argument list
          "$@" run --all-files --show-diff-on-failure --color always ${EXTRA_ARGS}
