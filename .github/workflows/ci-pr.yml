name: ci-pr

# The org's non-negotiables, enforced on every pull request: a Conventional
# Commits title (it becomes the squash commit), a Conventional Branch name, a
# size limit that pushes large work into a stack, and Conventional Commits on
# each commit in the branch.
#
# The checks live in .github/actions/pr-checks so this file stays readable. It is
# referenced with `$/`, GitHub's self-repository form, which resolves to THIS repo
# at the exact commit this workflow is running -- so the action and its scripts
# always match the version the caller pinned, with no second checkout and no
# self-referential SHA to keep updating.
#
# Titles and commits are linted with commitlint, against @commitlint/config-conventional.
# A repository adds to the rules, most often its own scopes, with a .commitlintrc.yaml
# at its root; only `rules` is read from it. Dependabot's pull requests are not linted.
#
# Nothing here reads a secret, and the pull request's code is only ever read as
# data, by git and by the YAML parser, never executed.

on:
  workflow_call:
    inputs:
      max-files:
        description: Most files a single pull request may change.
        type: number
        required: false
        default: 20
      check-commits:
        description: Also require every commit in the branch to be a Conventional Commit.
        type: boolean
        required: false
        default: true

permissions: {}

jobs:
  pr-checks:
    name: Title, branch, size, commits
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Check out the pull request
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # Both sides of the comparison have to be present for the size check.
          fetch-depth: 0
          persist-credentials: false

      - uses: $/.github/actions/pr-checks
        with:
          title: ${{ github.event.pull_request.title }}
          branch: ${{ github.head_ref }}
          author: ${{ github.event.pull_request.user.login }}
          base-sha: ${{ github.event.pull_request.base.sha }}
          head-sha: ${{ github.event.pull_request.head.sha }}
          max-files: ${{ inputs.max-files }}
          check-commits: ${{ inputs.check-commits }}
