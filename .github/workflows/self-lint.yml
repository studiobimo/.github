name: self-lint

# Dogfooding caller: runs the ci-lint library workflow against this repo's own source,
# which is the strongest proof it works before a consumer pins @v1. ci-lint runs this
# repo's lefthook pre-commit hook over every file: Prettier, actionlint, zizmor,
# shellcheck and the first-party pin check. Adds the tests that are specific to this
# repo and are not part of the exported library.

on:
  pull_request:
  workflow_dispatch:

permissions: {}

concurrency:
  group: self-lint-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Dependabot only ever bumps a pinned SHA or a dependency, and it vets what it
  # opens; running the full lint suite on those adds latency without adding signal.
  lint:
    if: ${{ !startsWith(github.head_ref, 'dependabot/') }}
    permissions:
      contents: read
    # `./` rather than `$/`, so actionlint checks the call; .github/zizmor.yml says why.
    uses: ./.github/workflows/ci-lint.yml

  # ci-workflows is the library for repos with no lefthook config. Nothing else here
  # calls it, so this is its only test.
  # ci-lint above already runs actionlint and zizmor over this repo's workflows through lefthook,
  # so this job only repeats that work when a workflow, action or shell script changes. Any other
  # pull request passes it with the guard alone.
  workflows:
    if: ${{ !startsWith(github.head_ref, 'dependabot/') }}
    permissions:
      contents: read
    uses: ./.github/workflows/ci-workflows.yml
    with:
      paths: |
        .github/**
        **/*.sh

  repo-checks:
    if: ${{ !startsWith(github.head_ref, 'dependabot/') }}
    # The name is a required check in rulesets/checks-dotgithub.json; change both together.
    name: Pins and formatting
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # This is the one check CI cannot infer from a green run. Our self-* workflows
      # are same-repo, and GitHub exempts same-repo action refs from the SHA-pinning
      # policy -- so a first-party ref pinned the wrong way passes here and fails in
      # every consumer. The script closes that blind spot.
      - name: Check first-party action pins
        run: sh .devtools/check-action-pins.sh

      # The same install ci-pr does, so the test below runs the commitlint consumers get.
      - name: Install commitlint for pr-checks
        run: npm ci --prefix .github/actions/pr-checks --ignore-scripts --no-audit --no-fund

      # ci-pr only exercises these scripts with a pull request's arguments. The git
      # hooks call them with none, and that path is tested here.
      - name: Test the check scripts
        run: bash .devtools/test-hooks.sh

      # Against a stand-in for gh, so it needs no token and reaches no repository.
      - name: Test the repository settings script
        run: bash .devtools/test-repo-settings.sh

      # Against a stand-in for gh too, with the commitlint installed above.
      - name: Test the issue title check
        run: bash .devtools/test-issue-title.sh

      # Against the output of each analyser and a stand-in for gh; self-repo-health runs the
      # analysers themselves.
      - name: Test the repo health check
        run: python3 .devtools/test-repo-health.py

      # Decision logic for the changed-paths guard the paths-gated reusables call. Pure Node,
      # no install: self-changed-paths runs the compare API call itself.
      - name: Test the changed-paths guard
        run: node --test .github/actions/changed-paths/changed-paths.test.mjs
