name: Setup Java and Gradle
description: Temurin JDK plus Gradle, with wrapper validation and branch-aware caching.

inputs:
  java-version:
    description: JDK version. Prefer passing the contents of a .java-version file so one file stays the source of truth.
    required: false
    default: '25'
  java-distribution:
    description: JDK distribution understood by actions/setup-java.
    required: false
    default: temurin
  validate-wrapper:
    description: Check gradle/wrapper/gradle-wrapper.jar against the known-good checksums.
    required: false
    default: 'true'
  cache-read-only:
    description: >-
      Leave unset to write the Gradle cache only on the default branch, which is what you want:
      a pull request reads the cache but cannot poison it. Set "false" to force writes.
    required: false
    default: ''

runs:
  using: composite
  steps:
    # A poisoned wrapper jar runs arbitrary code with the job's token, so this comes before Gradle.
    - if: inputs.validate-wrapper == 'true'
      uses: gradle/actions/wrapper-validation@3f5f9adaf7d9fecd50b5935e54106014257a94e6 # v6.4.0

    - uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6.0.1
      with:
        java-version: ${{ inputs.java-version }}
        distribution: ${{ inputs.java-distribution }}

    - uses: gradle/actions/setup-gradle@3f5f9adaf7d9fecd50b5935e54106014257a94e6 # v6.4.0
      with:
        cache-read-only: ${{ inputs.cache-read-only != '' && inputs.cache-read-only || (github.ref != format('refs/heads/{0}', github.event.repository.default_branch)) }}
        # Dependency locking and checksum verification are the project's job; this only reports.
        dependency-graph: disabled
