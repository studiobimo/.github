name: PR checks
description: Conventional PR title and branch name, a PR size limit, and Conventional Commits on every commit.

inputs:
  title:
    description: The pull request title. It becomes the squash commit, so it has to be a Conventional Commit.
    required: true
  branch:
    description: The pull request's head branch name.
    required: true
  base-sha:
    description: SHA of the pull request's base. For a stacked PR this is the layer below it.
    required: true
  head-sha:
    description: SHA of the pull request's head.
    required: true
  max-files:
    description: Most files a single pull request may change.
    required: false
    default: '20'
  check-commits:
    description: Also require every commit in the branch to be a Conventional Commit.
    required: false
    default: 'true'

runs:
  using: composite
  steps:
    # GITHUB_ACTION_PATH is this action's directory inside a checkout of the repo it
    # lives in, and the runner unpacks the whole repo -- so .devtools/ is already on
    # disk three levels up, with no second checkout, and the scripts always match the
    # commit the caller resolved.

    # commitlint, at the versions package-lock.json records. No install scripts run,
    # and the runner's own Node is enough (22.12 or newer).
    - shell: bash
      run: npm ci --prefix "${GITHUB_ACTION_PATH}" --ignore-scripts --no-audit --no-fund

    # lint.mjs adds the `rules` of the caller's .commitlintrc.yaml, if it has one, to
    # commitlint.default.yaml. It reads that file as data and runs nothing from it.
    - shell: bash
      env:
        TITLE: ${{ inputs.title }}
      run: 'node "${GITHUB_ACTION_PATH}/lint.mjs" --label ''pull request title'' "${TITLE}"'

    - shell: bash
      env:
        BRANCH: ${{ inputs.branch }}
      run: '${GITHUB_ACTION_PATH}/../../../.devtools/check-branch-name.sh "${BRANCH}"'

    - shell: bash
      env:
        BASE: ${{ inputs.base-sha }}
        HEAD: ${{ inputs.head-sha }}
        MAX: ${{ inputs.max-files }}
      run: '${GITHUB_ACTION_PATH}/../../../.devtools/check-pr-size.sh --base "${BASE}" --head "${HEAD}" --max "${MAX}"'

    - if: inputs.check-commits == 'true'
      shell: bash
      env:
        BASE: ${{ inputs.base-sha }}
        HEAD: ${{ inputs.head-sha }}
      run: |
        status=0
        # Merges are generated by GitHub, so only the commits a person wrote are checked.
        while read -r sha; do
          [ -n "${sha}" ] || continue
          if ! node "${GITHUB_ACTION_PATH}/lint.mjs" --label "commit ${sha:0:8}" "$(git log -1 --format=%B "${sha}")"; then
            status=1
          fi
        done <<< "$(git rev-list --no-merges "${BASE}".."${HEAD}")"
        exit "${status}"
