# Not a monorepo -- this file only carries pnpm settings (pnpm 11+ reads them here
# instead of the package.json "pnpm" field).
#
# pnpm installs one thing here: semantic-release, for release.yml. Everything else is
# pinned in mise.toml.
#
# Supply-chain policy: dependency build and install scripts are DENIED by default and
# must be approved here, one at a time, with a reason. Nothing needs one today.
onlyBuiltDependencies: []
