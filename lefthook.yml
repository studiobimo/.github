# Local git hooks. They run the same commands CI does, at the same versions:
#   commit-msg -> Conventional Commits, with this repo's scopes (commitlint)
#   pre-commit -> Prettier and the linters; ci-lint runs this hook over every file
#   pre-push   -> Conventional Branch name and the PR size limit (lefthook/org.yml)
#
# Every tool is pinned in mise.toml and run through `mise exec`, so a hook works
# whether or not the shell has mise activated, and never falls back to some other
# version that happens to be installed.
#
#   mise install && mise exec -- lefthook install

# The rules this repo shares with every other one, dogfooded from the same file.
extends:
  - lefthook/org.yml

commit-msg:
  jobs:
    - name: commitlint
      run: mise exec -- commitlint --edit {1}

pre-commit:
  parallel: true
  jobs:
    - name: prettier
      glob: '*.{yml,yaml,json,md,mjs}'
      run: mise exec -- prettier --check {staged_files}

    - name: actionlint
      glob: '.github/workflows/*.{yml,yaml}'
      run: mise exec -- actionlint {staged_files}

    # Workflows and composite actions both: zizmor audits action.yml too, and this
    # repo's whole output is those two file kinds. The glob is `.github/**` rather
    # than `.github/{workflows,actions}/**` because the latter silently misses files
    # sitting directly in .github/workflows/ -- i.e. every workflow in the repo.
    #
    # Exit 3 is "no inputs collected": none of the files were a workflow or an
    # action, which is the normal case for a commit that only touches an issue
    # template or dependabot.yml. Findings exit 14.
    - name: zizmor
      glob: '.github/**/*.{yml,yaml}'
      exclude: '**/node_modules/**'
      run: mise exec -- zizmor --no-progress {staged_files} || [ "$?" -eq 3 ]

    - name: shellcheck
      glob: '*.sh'
      run: mise exec -- shellcheck {staged_files}

    - name: gitleaks
      run: mise exec -- gitleaks git . --redact --staged

    # Same-repo CI cannot catch a first-party action ref pinned the wrong way --
    # GitHub's same-repo exemption hides it here and it breaks only consumers.
    - name: action-pins
      glob: '{.github/workflows,workflow-templates}/*.{yml,yaml}'
      run: sh .devtools/check-action-pins.sh
