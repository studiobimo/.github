name: Release

# Starter: the whole release path for a Minecraft mod, in one run.
#
#   push to default branch -> release-please grooms a release pull request
#   merge that pull request -> release-please tags it and cuts the GitHub Release
#                           -> publish-mod builds, attests and ships the jars
#
# Copied into your repo and owned by it from then on -- edit freely.
#
# Why both jobs live in ONE workflow rather than a separate `on: push: tags` publisher:
# a tag created with GITHUB_TOKEN does not trigger another workflow. GitHub suppresses
# that to stop runaway loops, and it would silently mean a release that never publishes.
# Chaining on `needs` and the `release-created` output is what makes the handoff reliable.
# It stays the handoff with the release app too: a tag made by the app does trigger other
# workflows, so a second publisher on `push: tags` or `release` would ship twice.
#
# The publish job holds your Modrinth and CurseForge tokens and runs this repo's own
# Gradle build. That is safe here and only here: this workflow triggers on a push to the
# default branch, which is code that already went through review. Never move these jobs
# to a `pull_request` trigger, where a fork could rewrite the build and read the tokens.
#
# Before the first real release:
#   1. Add release-please-config.json and .release-please-manifest.json to this repo.
#   2. Add MODRINTH_TOKEN and CURSEFORGE_TOKEN as repository secrets.
#   3. Install the studio's release app on this repo (organization settings -> GitHub
#      Apps -> the app -> Install App). A public repo then gets RELEASE_APP_CLIENT_ID and
#      RELEASE_APP_PRIVATE_KEY from the organization. A private repo does not, on the Free
#      plan: add both to the repo itself, as a variable and a secret. Until they resolve,
#      release-please falls back to GITHUB_TOKEN and the release pull request gets no checks.
#   4. Make sure your build actually has the publish task (mod-publish-plugin's
#      `publishMods`). Until it does, set `dry-run: true` below: the jars still get
#      built, attested and attached to the run, but nothing is pushed to a download page.

on:
  push:
    branches: [$default-branch]

permissions: {}

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  release:
    permissions:
      contents: write
      pull-requests: write
    uses: studiobimo/.github/.github/workflows/release-please.yml@v1
    # As the release app, not GITHUB_TOKEN: a pull request opened with GITHUB_TOKEN
    # triggers no workflows, so the release pull request's required checks would never run.
    with:
      app-client-id: ${{ vars.RELEASE_APP_CLIENT_ID }}
    secrets:
      app-private-key: ${{ secrets.RELEASE_APP_PRIVATE_KEY }}

  publish:
    needs: release
    # The only gate that matters: every push to the default branch runs the job above,
    # but only the one that merged the release pull request actually tagged anything.
    if: ${{ needs.release.outputs.release-created == 'true' }}
    permissions:
      # Uploading the jars onto the GitHub Release.
      contents: write
      # Signing the provenance attestation with a short-lived OIDC identity.
      id-token: write
      # Recording the attestation against the repository.
      attestations: write
    uses: studiobimo/.github/.github/workflows/publish-mod.yml@v1
    with:
      # Checked out by the publish job, so the jars are built from exactly what was tagged.
      tag-name: ${{ needs.release.outputs.tag-name }}
    # Explicit, never `secrets: inherit`. Both are optional: leave one out and that
    # platform is simply not published to.
    secrets:
      modrinth-token: ${{ secrets.MODRINTH_TOKEN }}
      curseforge-token: ${{ secrets.CURSEFORGE_TOKEN }}
