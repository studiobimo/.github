name: CI

# Starter: the per-pull-request checks for a Java/Gradle repo, each a thin caller of a
# centralized reusable. Copied into your repo and owned by it from then on -- edit freely.
#
# Drop the `workflows` job if this repo has no workflows of its own worth linting, and
# adjust gradle-tasks to whatever your build calls its check target.

on:
  push:
    branches: [$default-branch]
  pull_request:
    # A Gradle build is the expensive thing in this file, and a docs-only change
    # cannot affect it. `paths-ignore` rather than `paths` so it fails safe: anything
    # not listed here still runs the full suite.
    #
    # TWO THINGS TO KNOW BEFORE EDITING THIS LIST.
    #
    # 1. It skips the WHOLE workflow, including the secret scan. A secret pasted into
    #    a markdown file would not be caught until the push to $default-branch after
    #    merge. If you want it caught pre-merge, move the `secrets-scan` job into its
    #    own workflow file and leave that one unfiltered.
    # 2. A skipped job reports no status at all. That is harmless today, but the moment
    #    `check` is marked a REQUIRED check, every PR that skips it sits on
    #    "Expected -- waiting for status" and can never merge. At that point either drop
    #    this filter or add a job that always succeeds under the same name.
    paths-ignore:
      - '**/*.md'
      - 'docs/**'
      - 'LICENSE'
  merge_group:

permissions: {}

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    permissions:
      contents: read
    uses: studiobimo/.github/.github/workflows/ci-java-gradle.yml@v1
    with:
      gradle-tasks: check
      artifact-paths: |
        fabric/build/libs/*.jar
        neoforge/build/libs/*.jar

  workflows:
    permissions:
      contents: read
    uses: studiobimo/.github/.github/workflows/ci-workflows.yml@v1

  secrets-scan:
    permissions:
      contents: read
    uses: studiobimo/.github/.github/workflows/ci-gitleaks.yml@v1
