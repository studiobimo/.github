# The org's own rules as git hooks: the same scripts ci-pr runs on a pull request, so
# a bad branch name or an oversized branch is caught before the push, not in review.
#
# A repository pulls this in at the floating v1 tag, from its root lefthook.yml, and
# never copies it:
#
#   remotes:
#     - git_url: https://github.com/studiobimo/.github
#       ref: v1
#       refetch_frequency: 24h
#       configs:
#         - lefthook/org.yml
#
# The scripts need bash and git; pr-size also uses gh and jq when they are present,
# to find a stack's parent. Set BRANCH_NAME to check a name that is not checked out.
#
# post-merge tidies up after a merged pull request: on the default branch it deletes the
# local branches whose remote is gone and whose work is in, and keeps the rest.

pre-push:
  jobs:
    - name: branch-name
      script: branch-name.sh
      runner: bash

    - name: pr-size
      script: pr-size.sh
      runner: bash

post-merge:
  jobs:
    - name: prune-branches
      script: prune-branches.sh
      runner: bash
