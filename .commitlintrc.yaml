# Conventional Commits for this repo: commitlint's conventional config, plus the scopes
# AGENTS.md documents. A scope stays optional, but an invented one is rejected, so the
# two lists cannot drift apart.
#
# The commit-msg hook reads this file. So does ci-pr, on the pull request title and on
# every commit.
extends:
  - '@commitlint/config-conventional'

rules:
  scope-enum: [2, always, [actions, workflows, devtools, templates, docs, deps]]
